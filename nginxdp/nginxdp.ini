[nginx]
# Any option here can be overridden with NGINXDP_<OPTION>, e.g. NGINXDP_PORT.

port = 9681

# SSL configuration

# Enable SSL; only set this to false if you're testing on localhost or the
# service is behind a reverse proxy.
ssl_enabled = true

# When enabling SSL, specify ssl_certificate and ssl_certificate_key
# See examples below.

### Recommended for Kubernetes
; ssl_certificate = /etc/tls/tls.crt
; ssl_certificate_key = /etc/tls/tls.key

### Recommended for Let's Encrypt/Certbot
; ssl_certificate = /etc/letsencrypt/live/default/fullchain.pem
; ssl_certificate_key = /etc/letsencrypt/live/default/privkey.pem

# data_dir and log_dir must be writable by nginx.
data_dir = /srv/dataplacement
log_dir = /var/log/dataplacement
# Seconds between uploadmover polling passes (default 5).
uploadmover_period = 5
# Where the generated nginx configuration is written.
# Created on startup if it does not exist; must be readable by the
# nginx user.
generated_config = /run/nginxdp/nginx.conf
