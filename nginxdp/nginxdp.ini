[nginx]
port = 9681
ssl_enabled = false
ssl_certificate =
ssl_certificate_key =
# data_dir and log_dir must be writable by nginx.
data_dir = /srv/dataplacement
log_dir = /var/log/dataplacement
# Seconds between uploadmover polling passes (default 5).
uploadmover_period = 5
# Where the generated nginx configuration is written.
# Created on startup if it does not exist; must be readable by the
# nginx user.
generated_config = /run/nginxdp/nginx.conf
