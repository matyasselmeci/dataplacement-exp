[nginx]
# SSL certificate settings are required only when ssl_enabled is true.
# Missing directories are created by the wrapper; existing data roots must be
# writable by nginx.
port = 9681
ssl_enabled = false
ssl_certificate =
ssl_certificate_key =
data_dir = /srv/nginx-dataplacement
log_dir = /var/log/dataplacement
# Seconds between uploadmover polling passes (default 5).
uploadmover_period = 5
# Where the generated nginx configuration is written. Its directory is
# owned by root:nginx with mode 750 if the wrapper creates it.
generated_config = /run/nginxdp/nginx.conf
